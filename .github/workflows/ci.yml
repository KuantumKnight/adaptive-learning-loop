name: Verify Loop

on:
  push:
  pull_request:

jobs:
  backend-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - run: python -m pytest backend/tests/test_api.py -q
      - run: npm ci
      - run: npm run test:behavior
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loop
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d loop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IDP_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/loop
      IDP_RESEARCHER_TOKEN: ci-researcher
      IDP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - run: python backend/prepare.py
      - run: python -m pytest backend/tests/test_postgres_integration.py -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
